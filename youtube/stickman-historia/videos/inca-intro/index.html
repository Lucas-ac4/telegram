<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face {
        font-family: "Shantell Sans";
        src: url("assets/fonts/ShantellSans-latin.woff2") format("woff2");
        font-weight: 300 800;
        font-display: block;
      }
      :root {
        --paper: #ffffff;
        --ink: #1f1f1f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--paper);
        font-family: "Shantell Sans", sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <!--
      Intro del video 3 (Imperio Inca): hook + giro, 0:00–0:30.
      Narración que acompaña (ver guion/03-imperio-inca.md):
        0.0  "Seguro escuchaste que en 1532,"
        1.8  "168 hombres al mando de Pizarro"
        3.6  "derrotaron a un imperio de millones."
        5.6  "Pero ese imperio ya se estaba muriendo antes de que llegaran."
        9.2  "¿Por qué?"
        12.3 "Para entenderlo hay que contar la historia completa:"
        14.5 "cómo un reino chiquito en Cusco"
        16.5 "se convirtió en el imperio más grande de América,"
        19.0 "cómo funcionaba sin dinero, sin ruedas y sin escritura,"
        22.2 "y cómo se derrumbó."
        23.5 "Todo en quince minutos."
        25.0 "Arranquemos por el principio, que es una leyenda."
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <svg
        id="stage"
        class="clip"
        data-start="0"
        data-duration="30"
        data-track-index="0"
        data-layout-allow-overflow
        viewBox="0 0 1920 1080"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <clipPath id="spread"><circle id="spread-c" cx="0" cy="0" r="0" /></clipPath>
          <clipPath id="tawa-clip"><path id="tawa-path" d="" /></clipPath>
        </defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fd3f0" />
          <stop offset="1" stop-color="#e9f5fb" />
        </linearGradient>
        <g id="layer"></g>
      </svg>
    </div>
    <script>
      const R = window.Rig;
      R.setStill(true); // clean, steady lines: no boil
      const { kf, prog, C } = R;
      const DUR = 30;
      const GROUND = 900;
      const GOLD = "#e8b330", GOLD_DARK = "#b8860b", STEEL = "#8a96a3", INCA_RED = "#c62828";
      const layer = document.getElementById("layer");
      const spreadC = document.getElementById("spread-c");
      const tawaPath = document.getElementById("tawa-path");

      // ---------- fixed layouts (seeded once, never random per frame) ----------
      const seedRng = R.boilRng(0, 4242);
      const army = [];
      for (let row = 3; row >= 0; row--) {
        const s = 1.0 - row * 0.1, y = GROUND - row * 42, step = 50 * s;
        for (let x = 70 + (row % 2) * 24; x < 960; x += step) {
          army.push({ x: x + (seedRng() - 0.5) * 10, y, s, row, seed: 100 + army.length, band: seedRng() < 0.5 ? GOLD : INCA_RED, spear: seedRng() < 0.6, sick: seedRng() < 0.45 });
        }
      }
      const spaniards = [];
      for (let row = 2; row >= 0; row--) {
        const s = 0.62 - row * 0.05, y = GROUND - row * 30;
        for (let i = 0; i < 8; i++) spaniards.push({ x: 1520 + i * 36 + (row % 2) * 16, y, s, seed: 500 + spaniards.length });
      }
      const haze = [];
      for (let i = 0; i < 46; i++) haze.push({ x: seedRng() * 1000, y: 620 + seedRng() * 260, r: 3 + seedRng() * 6, v: 25 + seedRng() * 30, ph: seedRng() * 6 });

      // ---------- South America, hand-simplified (lon, lat) ----------
      const SA = [[-77,8.5],[-75.5,10.8],[-72,11.8],[-71,12.4],[-68,10.6],[-64,10.7],[-61.5,10.6],[-60,8.5],[-57,6],[-54,5.6],[-51.5,4.2],[-50,1.8],[-48.5,-1],[-44.5,-2.5],[-40,-2.8],[-37,-4.8],[-35,-6.5],[-35,-9],[-37,-11],[-39,-13.5],[-39,-17.5],[-40.5,-20.5],[-42,-23],[-45,-23.8],[-48.5,-26],[-48.7,-28.5],[-50.5,-31],[-53,-34],[-55,-35],[-57.5,-35.2],[-56.7,-36.5],[-57.5,-38.2],[-62,-39],[-62.3,-41],[-65,-42.5],[-65.2,-45],[-67.5,-46.5],[-66,-48],[-68.5,-50.5],[-69,-52],[-68.5,-54.5],[-71,-55],[-74,-52.5],[-75.5,-48],[-74,-44],[-73.5,-40],[-73.5,-37],[-72,-33],[-71.5,-30],[-71,-26],[-70.4,-23],[-70.2,-18.5],[-71.5,-17.3],[-75,-15.4],[-76.3,-13.5],[-78,-10.5],[-79.5,-7.5],[-81,-5.5],[-80.5,-3],[-80.3,-0.5],[-80,1],[-79,1.8],[-77.5,3.5],[-77.4,6.5],[-77,8.5]];
      // Tahuantinsuyo at its largest (approximate): Andes from southern Colombia to the Maule river
      const TAWA = [[-78.5,1.5],[-80,1],[-80.3,-0.5],[-80.5,-3],[-81,-5.5],[-79.5,-7.5],[-78,-10.5],[-76.3,-13.5],[-75,-15.4],[-71.5,-17.3],[-70.2,-18.5],[-70.4,-23],[-71,-26],[-71.5,-30],[-72,-33],[-72.3,-35.5],[-70,-35],[-68.5,-33],[-66,-28],[-65,-24],[-64,-20],[-64.5,-17],[-67,-14],[-71,-12],[-73.5,-9],[-76,-6],[-77.5,-3],[-77.5,0],[-77,1.5],[-78.5,1.5]];
      const K = 11.6, MX = 420, MY = 140;
      const proj = ([lon, lat]) => [MX + (lon + 82) * K, MY + (13 - lat) * K];
      const SA_P = SA.map(proj), TAWA_P = TAWA.map(proj);
      const CUSCO = proj([-72, -13.5]), TITICACA = proj([-69.4, -15.8]);
      const polyLen = (pts) => pts.reduce((a, p, i) => (i ? a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);
      const SA_LEN = polyLen(SA_P) * 1.03;
      const SA_D = "M" + SA_P.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + "Z";
      const TAWA_D = "M" + TAWA_P.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + "Z";
      tawaPath.setAttribute("d", "M" + TAWA.map((q) => [MX + (q[0] + 82) * K, MY + (13 - q[1]) * K].map((v) => v.toFixed(1)).join(" ")).join(" L") + "Z");
      const CRACK = [[CUSCO[0] - 70, CUSCO[1] - 210], [CUSCO[0] - 30, CUSCO[1] - 120], [CUSCO[0] - 55, CUSCO[1] - 60], [CUSCO[0] + 5, CUSCO[1]], [CUSCO[0] - 10, CUSCO[1] + 70], [CUSCO[0] + 40, CUSCO[1] + 150], [CUSCO[0] + 20, CUSCO[1] + 240], [CUSCO[0] + 60, CUSCO[1] + 330]];

      function mix(a, b, p) {
        const h = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
        const A = h(a), B = h(b);
        return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, "0")).join("");
      }

      // ---------- scene A: 168 vs. millions ----------
      function sapaInca(t) {
        const p = {
          x: 1090, y: GROUND, s: 1.6, f: 1, seed: 21, skin: "#e9b98f", shoe: "#c79a5b", hat: "mascaipacha", earSpools: true,
          tunic: { fill: INCA_RED, band: [GOLD, C.ink] }, look: 0.35, mouth: 0.15,
          ...R.walk(0, 0),
        };
        const pop = kf(t, [[3.6, 0], [4.0, 1, "back"]]);
        p.squash = (1 - pop) * 0.5;
        p.y = GROUND + (1 - pop) * 40;
        // coughing fits
        let cough = 0;
        [6.0, 6.75, 7.6].forEach((c) => (cough = Math.max(cough, kf(t, [[c, 0], [c + 0.08, 1, "out"], [c + 0.4, 0]]))));
        p.lean = cough * 0.32;
        p.squash += cough * 0.07;
        p.chinHand = kf(t, [[5.85, 0], [6.05, 1, "out"], [8.3, 1], [8.7, 0]]);
        p.worry = kf(t, [[5.9, 0], [6.3, 1]]);
        p.sweat = kf(t, [[6.4, 0], [6.8, 1], [11.5, 1]]);
        if (cough > 0.4) { p.eyes = "closed"; p.mouthO = 1; }
        if (t > 9.0) p.look = kf(t, [[9.0, 0.35], [9.4, 0.05]]);
        return p;
      }
      function pizarro(t) {
        const p = {
          x: 1420, y: GROUND, s: 1.2, f: -1, seed: 31, hat: "morion", beard: "#8a8a8a", shoe: "#3a2a20", legs: "#5a4632",
          tunic: { fill: STEEL, sash: "#a51d2d" }, look: 0.8, mouth: 0,
          ...R.walk(0, 0),
        };
        const pop = kf(t, [[1.8, 0], [2.2, 1, "back"]]);
        p.squash = (1 - pop) * 0.5;
        p.y = GROUND + (1 - pop) * 30;
        // ¿por qué?: turns to camera and shrugs
        const sh = kf(t, [[9.2, 0], [9.5, 1, "out"], [11.6, 1]]);
        p.look = R.lerp(0.8, 0.05, sh);
        p.armF = R.lerp(p.armF, { a: 1.35, b: 0.95 }, sh);
        p.armB = R.lerp(p.armB, { a: -1.35, b: -0.95 }, sh);
        p.browsUp = sh;
        p.bob = sh * -4;
        p.mouth = -0.3 * sh;
        return p;
      }

      // static backdrops (no animation: the characters are the show)
      const BG_A =
        `<rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>` +
        `<path d="M0 700 L180 560 L330 640 L520 470 L700 610 L860 520 L1040 640 L1220 500 L1420 620 L1600 480 L1780 600 L1920 540 L1920 ${GROUND} L0 ${GROUND}Z" fill="#b9c7d6" stroke="#8fa1b5" stroke-width="4" stroke-linejoin="round"/>` +
        `<path d="M520 470 L470 512 L500 508 L520 488 L548 510 L575 500Z M1600 480 L1556 516 L1584 512 L1600 496 L1626 514 L1650 504Z M1220 500 L1180 534 L1206 530 L1220 516 L1240 530 L1262 522Z" fill="#ffffff"/>` +
        `<path d="M0 790 Q300 740 640 780 T1300 770 T1920 760 L1920 ${GROUND} L0 ${GROUND}Z" fill="#c9d79a"/>` +
        `<rect x="0" y="${GROUND}" width="1920" height="${1080 - GROUND}" fill="#d9c58e"/>`;
      const BG_B = `<rect x="0" y="0" width="1920" height="1080" fill="#cfe7f4"/>`;

      function sceneA(t) {
        let o = BG_A + R.ground(t, GROUND, 0, 1920, prog(t, 0, 0.6, "out"));
        o += R.write(t, "1532", 120, 150, 0.3, 1.0, { size: 84, weight: 800, rot: -3 });

        // the army builds up left to right
        army.forEach((a, i) => {
          const at = 3.6 + (a.x / 960) * 1.4 + a.row * 0.08;
          const pop = kf(t, [[at, 0], [at + 0.25, 1, "back"]]);
          if (pop <= 0.01) return;
          const slump = a.sick ? kf(t, [[6.4 + (i % 7) * 0.25, 0], [7.4 + (i % 7) * 0.25, 1]]) * 0.9 : 0;
          o += R.mini(t, a.x, a.y + (1 - pop) * 20, a.s * pop, { seed: a.seed, band: GOLD, cloth: a.band === GOLD ? "#f2e6c9" : INCA_RED, spear: a.spear, tip: GOLD, slump, skin: "#e9b98f", look: 0.6 });
        });
        if (t > 3.6) o += R.hatch(t, 520, GROUND, 460, 7, prog(t, 3.8, 4.6));

        // the sickness drifts over the army
        const hz = kf(t, [[5.7, 0], [6.6, 1], [11.6, 1], [12.2, 0]]);
        if (hz > 0.01) {
          haze.forEach((h, i) => {
            const x = 40 + ((h.x + (t - 5.7) * h.v) % 1000);
            o += `<circle cx="${x.toFixed(1)}" cy="${(h.y + Math.sin(t * 1.5 + h.ph) * 8).toFixed(1)}" r="${h.r.toFixed(1)}" fill="#7d7d7d" opacity="${(0.35 * hz).toFixed(2)}"/>`;
          });
        }

        // 168 Spaniards: a small cluster
        spaniards.forEach((sp, i) => {
          const at = 1.9 + i * 0.05;
          const pop = kf(t, [[at, 0], [at + 0.2, 1, "back"]]);
          if (pop <= 0.01) return;
          o += R.mini(t, sp.x, sp.y + (1 - pop) * 14, sp.s * pop, { seed: sp.seed, helmet: "morion", spear: true, tip: "#c9d1d9", cloth: STEEL, look: -0.6 });
        });
        if (t > 1.9) o += R.hatch(t, 1650, GROUND, 190, 8, prog(t, 2.0, 2.6));

        o += R.chibi(t, pizarro(t));
        if (t > 3.6) o += R.chibi(t, sapaInca(t));

        // the score, top of frame
        o += R.write(t, "168", 1650, 330, 2.3, 2.7, { size: 120, weight: 800, fill: STEEL, anchor: "middle", rot: 2 });
        o += R.write(t, "vs.", 1250, 320, 4.0, 4.2, { size: 64, weight: 700, anchor: "middle" });
        o += `<g opacity="1">` + R.write(t, "millones", 560, 330, 4.3, 5.0, { size: 120, weight: 800, fill: GOLD_DARK, anchor: "middle", rot: -2 }) + `</g>`;

        // ¿por qué?
        const q = kf(t, [[9.5, 0], [9.85, 1, "back"]]);
        if (q > 0.01) {
          o += `<g transform="translate(1440 ${GROUND - 470 + Math.sin(t * 3) * 5}) scale(${q}) rotate(${Math.sin(t * 2) * 6})"><text x="0" y="0" font-family="${R.FONT}" font-weight="800" font-size="130" text-anchor="middle" fill="${C.red}" stroke="${C.ink}" stroke-width="5" paint-order="stroke">?</text></g>`;
        }
        return o;
      }

      // ---------- scene B: the map and the promise ----------
      function coinIcon(t, x, y, sc) {
        if (sc <= 0.01) return "";
        const rng = R.boilRng(t, 701);
        return `<g transform="translate(${x} ${y}) scale(${sc})">` + R.path(R.blob(0, 0, 62, 62, rng, 1.2, 14), { fill: GOLD, w: 6 }) + R.path(R.blob(0, 0, 44, 44, rng, 1, 12), { w: 4 }) +
          `<text x="0" y="22" font-family="${R.FONT}" font-weight="800" font-size="64" text-anchor="middle" fill="${C.ink}">$</text></g>`;
      }
      function wheelIcon(t, x, y, sc) {
        if (sc <= 0.01) return "";
        const rng = R.boilRng(t, 702);
        let g = R.path(R.blob(0, 0, 62, 62, rng, 1.2, 14), { fill: "#d9b48a", w: 6 }) + R.path(R.blob(0, 0, 14, 14, rng, 0.6, 8), { fill: "#8a5a3c", w: 4 });
        for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + t * 0.6; g += R.path(R.wob([[Math.cos(a) * 14, Math.sin(a) * 14], [Math.cos(a) * 58, Math.sin(a) * 58]], rng, 0.8), { w: 5, stroke: "#8a5a3c" }); }
        return `<g transform="translate(${x} ${y}) scale(${sc})">${g}</g>`;
      }
      function writingIcon(t, x, y, sc) {
        if (sc <= 0.01) return "";
        const rng = R.boilRng(t, 703);
        let g = R.path(R.wob([[-52, -66], [52, -66], [52, 66], [-52, 66], [-52, -66]], rng, 1.2), { fill: "#fffdf5", w: 6 });
        g += `<text x="0" y="-12" font-family="${R.FONT}" font-weight="800" font-size="52" text-anchor="middle" fill="${C.ink}">Aa</text>`;
        for (let i = 0; i < 3; i++) g += R.path(R.wob([[-34, 14 + i * 16], [34 - i * 12, 14 + i * 16]], rng, 0.8), { w: 4 });
        return `<g transform="translate(${x} ${y}) scale(${sc})">${g}</g>`;
      }
      function cross(t, x, y, pr, seed) {
        return R.scribble(t, [[x - 70, y - 70], [x + 70, y + 70]], prog(pr, 0, 0.5), C.red, 14, seed) +
          R.scribble(t, [[x + 70, y - 70], [x - 70, y + 70]], prog(pr, 0.5, 1), C.red, 14, seed + 1);
      }
      function hourglass(t, x, y, sc) {
        if (sc <= 0.01) return "";
        const rng = R.boilRng(t, 704);
        const sand = prog(t, 23.6, 30, "lin");
        const top = 1 - sand * 0.55, bot = sand * 0.55;
        let g = R.path(R.wob([[-70, -110], [70, -110]], rng, 1), { w: 8, stroke: "#8a5a3c" }) + R.path(R.wob([[-70, 110], [70, 110]], rng, 1), { w: 8, stroke: "#8a5a3c" });
        // sand (drawn under the glass outline)
        g += `<path d="M${-48 * top} ${-8 - 92 * top} L${48 * top} ${-8 - 92 * top} L0 -6Z" fill="${GOLD}"/>`;
        g += `<path d="M${-50 * Math.sqrt(bot)} 102 L${50 * Math.sqrt(bot)} 102 L0 ${102 - 80 * bot}Z" fill="${GOLD}"/>`;
        g += `<path d="M-1.5 -6 L1.5 -6 L1.5 102 L-1.5 102Z" fill="${GOLD}" opacity="${sand > 0 && sand < 1 ? 1 : 0}"/>`;
        g += R.path(R.wob([[-55, -104], [-6, -4], [-55, 104]], rng, 1), { w: 6 }) + R.path(R.wob([[55, -104], [6, -4], [55, 104]], rng, 1), { w: 6 });
        return `<g transform="translate(${x} ${y}) scale(${sc}) rotate(${Math.sin(t * 2) * 2})">${g}</g>`;
      }

      function sceneB(t) {
        let o = BG_B;
        // continent outline draws itself
        const dp = prog(t, 12.5, 14.6, "inOut");
        o += `<path d="${SA_D}" fill="${mix("#cfe7f4", "#f1e7c8", dp)}" stroke="${C.ink}" stroke-width="5" stroke-linejoin="round" stroke-dasharray="${SA_LEN.toFixed(1)}" stroke-dashoffset="${(SA_LEN * (1 - dp)).toFixed(1)}"/>`;

        // the empire spreads from Cusco, then cracks and greys out
        const sp = prog(t, 16.5, 19.0, "inOut");
        spreadC.setAttribute("cx", CUSCO[0]);
        spreadC.setAttribute("cy", CUSCO[1]);
        spreadC.setAttribute("r", (sp * 300).toFixed(1));
        const fall = prog(t, 22.3, 23.2, "inOut");
        if (sp > 0) o += `<path d="${TAWA_D}" clip-path="url(#spread)" fill="${mix(GOLD, "#bdb6a4", fall)}" stroke="${mix(GOLD_DARK, "#8f8a7e", fall)}" stroke-width="4" stroke-linejoin="round"/>`;
        if (t > 22.2) o += `<g clip-path="url(#tawa-clip)">` + R.scribble(t, CRACK, prog(t, 22.2, 22.9, "out"), C.ink, 7, 801) + `</g>`;

        // Cusco: one pulsing dot
        if (t > 14.5) {
          const pop = kf(t, [[14.5, 0], [14.8, 1, "back"]]);
          const pulse = 1 + 0.18 * Math.max(0, Math.sin((t - 14.8) * 5));
          o += `<circle cx="${CUSCO[0]}" cy="${CUSCO[1]}" r="${(13 * pop * pulse).toFixed(1)}" fill="${INCA_RED}" stroke="${C.ink}" stroke-width="4"/>`;
          o += R.write(t, "Cusco", CUSCO[0] - 30, CUSCO[1] + 8, 14.8, 15.4, { size: 50, weight: 760, anchor: "end" });
        }

        // no money, no wheels, no writing
        const iconsOut = kf(t, [[23.0, 1], [23.35, 0, "in"]]);
        const ic = [
          [coinIcon, 330, 19.2, 901],
          [wheelIcon, 560, 20.1, 903],
          [writingIcon, 790, 21.0, 905],
        ];
        ic.forEach(([fn, y, at, sd]) => {
          const sc = kf(t, [[at, 0], [at + 0.3, 1, "back"]]) * iconsOut;
          o += fn(t, 1500, y, sc);
          if (t > at + 0.3 && iconsOut > 0.01) o += `<g opacity="${iconsOut}">` + cross(t, 1500, y, prog(t, at + 0.3, at + 0.75, "lin"), sd) + `</g>`;
        });

        // the promise: 15 minutes
        o += hourglass(t, 1500, 450, kf(t, [[23.4, 0], [23.8, 1, "back"]]));
        o += R.write(t, "15 minutos", 1500, 640, 23.9, 24.6, { size: 70, weight: 800, anchor: "middle" });

        // the Sun peeks in, bored, and looks down at Lake Titicaca
        const sy = kf(t, [[25.0, -220], [25.7, 150, "out"]]);
        if (t > 25.0) {
          const look = kf(t, [[26.6, 0], [27.0, -1]]), down = kf(t, [[26.6, 0], [27.0, 1]]);
          o += R.sun(t, 1150, sy, 78, 1, 905, { look, down, lids: 0, mouth: 1 });
        }
        if (t > 26.4) {
          const lp = kf(t, [[26.4, 0], [26.8, 1, "back"]]);
          o += R.path(R.blob(TITICACA[0], TITICACA[1], 16 * lp, 10 * lp, R.boilRng(t, 906), 0.8, 10), { fill: "#5aa9e6", w: 4 });
          const tw = Math.max(0, Math.sin((t - 26.8) * 6)) * lp;
          if (tw > 0.05) o += R.path(`M${TITICACA[0] + 22} ${TITICACA[1] - 24 - 10 * tw} L${TITICACA[0] + 22} ${TITICACA[1] - 24 + 10 * tw} M${TITICACA[0] + 12 - 10 * tw} ${TITICACA[1] - 24} L${TITICACA[0] + 32 + 10 * tw} ${TITICACA[1] - 24}`, { w: 4, stroke: "#5aa9e6" });
        }

        // the llama wanders in and stares at the viewer
        if (t > 27.0) {
          const lx = kf(t, [[27.0, 2060], [28.3, 1500, "out"]]);
          const hop = Math.abs(Math.sin((t - 27.0) * 9)) * 10 * (1 - prog(t, 28.0, 28.4));
          o += R.ground(t, 1010, 1250, 1780, prog(t, 27.6, 28.2), 907);
          o += R.llama(t, { x: lx, y: 1010 - hop, s: 1.25, f: -1, seed: 91, look: kf(t, [[28.3, 1], [28.7, 0]]), chew: t > 28.7 ? (t - 28.7) * 1.6 : 0, blink: t > 29.3 && t < 29.42 });
        }
        return o;
      }

      function renderAt(t) {
        const a = kf(t, [[0, 1], [12.0, 1], [12.5, 0]]);
        const b = kf(t, [[12.3, 0], [12.7, 1]]);
        let o = "";
        if (a > 0.01) o += `<g opacity="${a.toFixed(3)}">${sceneA(t)}</g>`;
        if (b > 0.01) o += `<g opacity="${b.toFixed(3)}">${sceneB(t)}</g>`;
        layer.innerHTML = o;
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      renderAt(0);
    </script>
  </body>
</html>
