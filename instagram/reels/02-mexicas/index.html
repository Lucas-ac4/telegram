<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <style>
      @font-face {
        font-family: "Shantell Sans";
        src: url("assets/fonts/ShantellSans-latin.woff2") format("woff2");
        font-weight: 300 800;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e7f0e1; }
      #root { position: relative; width: 100%; height: 100%; background: #e7f0e1; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <!-- Siglos en Palitos — Short 2: LAS CIVILIZACIONES DE AMÉRICA, parte 2: LOS MEXICAS.
         Guion: instagram/guiones/02-mexicas.md. Every scene is timed as a fraction of its
         narration block, so voice/tools/sincronizar.py can retime the whole Short from the voice. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="83.05" data-width="1080" data-height="1920">
      <audio id="narracion" src="assets/narracion.mp3" data-start="2.55" data-track-index="2" data-volume="1"></audio>
      <audio id="titulo" src="assets/titulo.mp3" data-start="0.25" data-track-index="3" data-volume="1"></audio>
      <svg id="stage" class="clip" data-start="0" data-duration="83.05" data-track-index="0" data-layout-allow-overflow
        viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9fd3f0" /><stop offset="1" stop-color="#e9f5fb" />
          </linearGradient>
        </defs>
        <g id="layer"></g>
      </svg>
    </div>
    <script>
      const R = window.Rig;
      R.setStill(true);
      const { kf, prog, C } = R;
      const DUR = 83.05, W = 1080, GROUND = 1250, GY = 920; // GY: street level in the cross-section scenes
      const GOLD = "#e8b330", GOLD_DARK = "#b8860b", STEEL = "#8a96a3", RED = "#c62828", BLUE = "#1f6fb2", GREEN = "#2e9e5b", SKIN = "#d9a37a";
      const layer = document.getElementById("layer");
      const FONT = R.FONT;

      // ---------- narration blocks (seconds) ----------
      const BLOCKS = [
        [2.5, 10.05, "¿Conoces a los aztecas? ¿Sabías que ese nunca fue su nombre, y que su capital nunca murió en 1521?"],
        [10.05, 29.79, "Se llamaban mexicas, y hoy te cuento su historia. Te dicen que 500 españoles borraron su capital del mapa, pero veamos qué pasó. Según su leyenda, debían fundar la ciudad en donde vieran un águila sobre un nopal. La vieron en una isla, en medio de un lago. Ahí, hacia 1325, nació Tenochtitlan."],
        [29.79, 38.4, "Empezaron como un pueblo chico. Pero en 1428 se aliaron con dos ciudades vecinas y empezaron a cobrarle tributo a medio México."],
        [38.4, 46.4, "Su capital no se parecía a nada: calzadas sobre el agua, un acueducto y cultivos en el lago. Los españoles creían que soñaban."],
        [46.4, 59.47, "Hernán Cortés llegó en 1519 con unos 500 hombres. Pero no estaba solo: miles de tlaxcaltecas, que odiaban a los mexicas, se unieron a él. Y la viruela hizo el resto: mató hasta al nuevo emperador."],
        [59.47, 69.0, "En 1521, después de meses de guerra, Tenochtitlan cayó. Los españoles construyeron encima, con las mismas piedras: la Ciudad de México."],
        [69.0, 80.05, "Por eso hoy millones caminan sobre la vieja Tenochtitlan sin saberlo. En 1978, unos obreros de la compañía de luz cavaron en pleno centro y se toparon con el Templo Mayor."],
        [80.05, 82.05, "Si te gustó, dale like."],
      ];
      // time at fraction f (0..1) of narration block i
      const at = (i, f) => BLOCKS[i][0] + f * (BLOCKS[i][1] - BLOCKS[i][0]);

      const KEY = new Set(["500", "1521", "azteca", "aztecas", "mexicas", "águila", "nopal", "lago", "1325", "tenochtitlan", "1428", "tributo", "calzadas", "acueducto", "chinampas", "soñando", "cortés", "1519", "tlaxcaltecas", "viruela", "emperador", "méxico", "encima", "saberlo", "guerra", "soñaban", "1978", "templo", "mayor", "like", "nunca"]);
      // start time of every caption word, from the ElevenLabs narration (seconds)
      const WT = [2.55, 3.034, 3.109, 3.27, 4.081, 4.627, 4.776, 5.118, 5.484, 5.701, 5.854, 6.584, 6.658, 6.795, 6.938, 7.652, 8.037, 8.384, 8.521, 10.104, 10.233, 10.707, 11.545, 11.657, 11.843, 12.017, 12.265, 12.422, 13.185, 13.39, 13.67, 13.775, 14.31, 14.963, 15.39, 15.496, 15.943, 16.17, 16.816, 16.985, 17.327, 17.457, 18.062, 18.494, 18.65, 19.376, 19.741, 20.035, 20.137, 20.506, 20.643, 20.874, 21.277, 21.5, 21.91, 22.146, 22.283, 22.983, 23.264, 23.574, 23.711, 23.922, 24.468, 24.617, 24.915, 25.04, 25.164, 25.793, 26.475, 26.699, 28.338, 28.729, 29.843, 30.39, 30.594, 30.687, 30.991, 31.635, 31.932, 32.019, 33.447, 33.733, 34.105, 34.254, 34.416, 34.869, 35.596, 35.745, 36.118, 36.211, 36.662, 37.161, 37.273, 37.72, 38.453, 38.719, 39.16, 39.309, 39.453, 39.968, 40.079, 40.724, 41.227, 41.439, 41.563, 42.208, 42.357, 42.867, 42.964, 43.475, 43.6, 43.687, 44.255, 44.592, 45.101, 45.474, 45.635, 46.45, 46.852, 47.269, 47.512, 47.649, 48.786, 49.013, 49.276, 49.829, 50.505, 50.791, 50.934, 51.263, 51.937, 52.272, 52.371, 53.458, 53.551, 53.924, 53.998, 54.166, 54.905, 55.054, 55.414, 55.551, 56.004, 56.219, 56.325, 56.761, 56.965, 57.088, 57.898, 58.252, 58.371, 58.469, 58.743, 59.519, 59.784, 61.302, 61.653, 61.765, 62.1, 62.203, 62.783, 63.454, 64.108, 64.412, 64.927, 65.536, 66.188, 66.337, 66.509, 66.881, 67.741, 67.844, 68.188, 68.312, 69.051, 69.324, 69.491, 69.7, 70.088, 70.454, 70.728, 70.833, 71.131, 71.876, 72.106, 72.863, 73.089, 74.9, 75.176, 75.462, 75.561, 75.713, 76.157, 76.331, 76.648, 77.2, 77.325, 77.608, 78.231, 78.368, 78.467, 78.884, 78.989, 79.133, 79.461, 80.099, 80.385, 80.545, 81.267, 81.618];
      const WORDS = [];
      BLOCKS.forEach(([a, b, txt]) => {
        const ws = txt.split(/\s+/);
        const span = (b - 0.35 - a) / ws.length;
        ws.forEach((w, i) => WORDS.push({ w, t: WT[WORDS.length] ?? a + i * span, key: KEY.has(w.toLowerCase().replace(/[^\wáéíóúñü]/g, "")) }));
      });
      // captions: chunks of 3 words, word by word; keywords in yellow
      function captions(t) {
        let idx = -1;
        for (let i = 0; i < WORDS.length; i++) if (WORDS[i].t <= t) idx = i;
        if (idx < 0) return "";
        const blockEnd = BLOCKS.find(([a, b]) => t >= a && t < b);
        if (!blockEnd) return "";
        const c0 = idx - (idx % 3), chunk = WORDS.slice(c0, c0 + 3).filter((w) => w.t >= blockEnd[0] - 0.01);
        if (!chunk.length) return "";
        const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
        const spans = chunk.filter((w, i) => c0 + i <= idx).map((w) => `<tspan fill="${w.key ? "#ffd23f" : "#ffffff"}">${esc(w.w)} </tspan>`).join("");
        const pop = 1 + 0.06 * (1 - prog(t, WORDS[idx].t, WORDS[idx].t + 0.12, "out"));
        return `<g transform="translate(540 1440) scale(${pop.toFixed(3)})"><text x="0" y="0" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="70" stroke="#1f1f1f" stroke-width="12" paint-order="stroke" stroke-linejoin="round">${spans}</text></g>`;
      }
      function title(t, txt, a, b, y = 270, size = 92, fill = "#1f1f1f") {
        const sc = kf(t, [[a, 0], [a + 0.3, 1, "back"], [b - 0.25, 1], [b, 0, "in"]]);
        if (sc <= 0.01) return "";
        return `<g transform="translate(540 ${y}) scale(${sc.toFixed(3)})"><text x="0" y="0" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="${size}" fill="${fill}" stroke="#ffffff" stroke-width="14" paint-order="stroke" stroke-linejoin="round">${txt}</text></g>`;
      }
      function pop(t, a) { return kf(t, [[a, 0], [a + 0.3, 1, "back"]]); }
      function popIn(p, t, a) { const k = pop(t, a); p.squash = (p.squash || 0) + (1 - k) * 0.5; p.y += (1 - k) * 40; return k > 0.01; }
      function cross(t, x, y, pr, seed, sz = 80) {
        return R.scribble(t, [[x - sz, y - sz], [x + sz, y + sz]], prog(pr, 0, 0.5), C.red, 16, seed) + R.scribble(t, [[x + sz, y - sz], [x - sz, y + sz]], prog(pr, 0.5, 1), C.red, 16, seed + 1);
      }

      // ---------- backdrops ----------
      const BG_SOFT = `<rect width="1080" height="1920" fill="#e7f0e1"/>`;
      const BG_SKY = `<rect width="1080" height="1920" fill="url(#sky)"/>` +
        `<path d="M0 1010 L140 880 L260 960 L420 820 L560 940 L700 840 L860 960 L1080 860 L1080 ${GROUND} L0 ${GROUND}Z" fill="#b9c7d6" stroke="#8fa1b5" stroke-width="4" stroke-linejoin="round"/>` +
        `<path d="M0 1120 Q270 1080 540 1110 T1080 1100 L1080 ${GROUND} L0 ${GROUND}Z" fill="#c9d79a"/>` +
        `<rect x="0" y="${GROUND}" width="1080" height="${1920 - GROUND}" fill="#d9c58e"/>`;
      // the Valley of Mexico: volcanoes and the lake
      const BG_LAKE = `<rect width="1080" height="1920" fill="url(#sky)"/>` +
        `<path d="M-20 900 L180 640 L250 640 L460 900Z" fill="#b9c7d6" stroke="#8fa1b5" stroke-width="4" stroke-linejoin="round"/><path d="M180 640 L250 640 L282 682 L148 682Z" fill="#fff"/>` +
        `<path d="M560 900 L760 700 L820 700 L1100 900Z" fill="#c5d1de" stroke="#8fa1b5" stroke-width="4" stroke-linejoin="round"/><path d="M760 700 L820 700 L848 728 L734 728Z" fill="#fff"/>` +
        `<rect x="0" y="880" width="1080" height="480" fill="#7cc0e8"/><path d="M0 880 L1080 880" stroke="#5aa0cf" stroke-width="6"/>` +
        `<rect x="0" y="1340" width="1080" height="580" fill="#c9d79a"/><path d="M0 1340 Q540 1310 1080 1340" stroke="#1f1f1f" stroke-width="5" fill="none"/>`;

      // ---------- props ----------
      function pyramid(x, y, s, col = "#c9b27a") {
        let g = "";
        for (let i = 0; i < 4; i++) {
          const w = 210 - i * 42, h = 34, yy = -i * h;
          g += `<rect x="${-w / 2}" y="${yy - h}" width="${w}" height="${h}" fill="${col}" stroke="#1f1f1f" stroke-width="5"/>`;
        }
        g += `<rect x="-14" y="-136" width="28" height="136" fill="#a8925e" stroke="#1f1f1f" stroke-width="4"/>`;
        g += `<rect x="-58" y="-180" width="44" height="44" fill="${RED}" stroke="#1f1f1f" stroke-width="5"/><rect x="14" y="-180" width="44" height="44" fill="${BLUE}" stroke="#1f1f1f" stroke-width="5"/>`;
        return `<g transform="translate(${x} ${y}) scale(${s})">${g}</g>`;
      }
      function houses(x, y, n, s = 1, seed = 1) {
        let g = "";
        for (let i = 0; i < n; i++) {
          const hx = x + (i - n / 2) * 48 * s, hy = y + ((i * 37 + seed) % 3) * 8 * s;
          g += `<rect x="${hx}" y="${hy - 34 * s}" width="${40 * s}" height="${34 * s}" fill="#f4ede0" stroke="#1f1f1f" stroke-width="4"/>`;
        }
        return g;
      }
      // Tenochtitlan on its island; grow 0..1 adds causeways, aqueduct, chinampas
      function city(t, o = {}) {
        const cx = 540, cy = 1110, k = o.k == null ? 1 : o.k;
        let g = "";
        const gr = o.grow || 0;
        if (gr > 0) {
          const c1 = prog(gr, 0, 0.35);
          g += `<path d="M${cx - 250} ${cy} L${cx - 250 - 290 * c1} ${cy - 30 * c1} M${cx + 250} ${cy} L${cx + 250 + 290 * c1} ${cy - 30 * c1} M${cx} ${cy + 60} L${cx} ${cy + 60 + 200 * c1}" stroke="#1f1f1f" stroke-width="22" stroke-linecap="round"/>`;
          g += `<path d="M${cx - 250} ${cy} L${cx - 250 - 290 * c1} ${cy - 30 * c1} M${cx + 250} ${cy} L${cx + 250 + 290 * c1} ${cy - 30 * c1} M${cx} ${cy + 60} L${cx} ${cy + 60 + 200 * c1}" stroke="#e1cf9e" stroke-width="14" stroke-linecap="round"/>`;
          const c2 = prog(gr, 0.35, 0.65);
          if (c2 > 0) {
            g += `<path d="M${cx + 200} ${cy - 40} L${cx + 200 + 330 * c2} ${cy - 210 * c2}" stroke="#1f1f1f" stroke-width="16" stroke-linecap="round"/><path d="M${cx + 200} ${cy - 40} L${cx + 200 + 330 * c2} ${cy - 210 * c2}" stroke="#9fd3f0" stroke-width="8" stroke-linecap="round"/>`;
            for (let i = 1; i < 6; i++) { const f = (i / 6) * c2; g += `<path d="M${cx + 200 + 330 * f} ${cy - 40 - 170 * f} L${cx + 200 + 330 * f} ${cy - 40 - 170 * f + 60}" stroke="#1f1f1f" stroke-width="6"/>`; }
          }
          const c3 = prog(gr, 0.65, 1);
          for (let i = 0; i < 8; i++) {
            const kk = prog(c3, i / 10, i / 10 + 0.3);
            if (kk <= 0) continue;
            const x = cx - 360 + (i % 4) * 70 + (i > 3 ? 470 : 0), y = cy + 70 + (i % 2) * 54;
            g += `<rect x="${x}" y="${y}" width="${60 * kk}" height="44" rx="6" fill="#6aa84f" stroke="#1f1f1f" stroke-width="4"/>`;
          }
        }
        g += `<ellipse cx="${cx}" cy="${cy + 20}" rx="270" ry="72" fill="#c9b27a" stroke="#1f1f1f" stroke-width="6"/>`;
        g += houses(cx - 150, cy + 30, 4, 0.9, 1) + houses(cx + 150, cy + 30, 4, 0.9, 2);
        g += pyramid(cx, cy + 40, 0.95);
        return `<g transform="translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})">${g}</g>`;
      }
      function eagleNopal(x, y, s) {
        if (s <= 0.01) return "";
        let g = "";
        [[0, 0, 42, 60], [-58, -70, 32, 46], [56, -66, 32, 46], [0, -120, 30, 44]].forEach(([px, py, rx, ry]) => (g += `<ellipse cx="${px}" cy="${py}" rx="${rx}" ry="${ry}" fill="#4f9a52" stroke="#1f1f1f" stroke-width="5"/>`));
        g += `<path d="M-120 -230 Q-60 -330 0 -250 Q60 -330 120 -230 Q60 -250 0 -200 Q-60 -250 -120 -230Z" fill="#7a4a2a" stroke="#1f1f1f" stroke-width="5" stroke-linejoin="round"/>`;
        g += `<ellipse cx="0" cy="-205" rx="34" ry="46" fill="#8a5a3c" stroke="#1f1f1f" stroke-width="5"/><circle cx="12" cy="-262" r="24" fill="#8a5a3c" stroke="#1f1f1f" stroke-width="5"/>`;
        g += `<path d="M30 -266 L56 -258 L32 -248Z" fill="${GOLD}" stroke="#1f1f1f" stroke-width="4"/><circle cx="18" cy="-268" r="4" fill="#1f1f1f"/>`;
        g += `<path d="M-14 -160 L-20 -148 M14 -160 L20 -148" stroke="${GOLD}" stroke-width="6" stroke-linecap="round"/>`;
        return `<g transform="translate(${x} ${y}) scale(${s})">${g}</g>`;
      }
      function item(kind, x, y, s = 1) {
        if (kind === "maiz") return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="14" ry="30" fill="${GOLD}" stroke="#1f1f1f" stroke-width="4"/><path d="M-14 10 Q-26 -20 -6 -34 M14 10 Q26 -20 6 -34" stroke="${GREEN}" stroke-width="6" fill="none"/></g>`;
        if (kind === "pluma") return `<g transform="translate(${x} ${y}) scale(${s}) rotate(25)"><path d="M0 30 Q20 0 0 -36 Q-20 0 0 30Z" fill="${GREEN}" stroke="#1f1f1f" stroke-width="4"/><path d="M0 30 L0 -30" stroke="#1f1f1f" stroke-width="3"/></g>`;
        return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="18" ry="26" fill="#7a4a2a" stroke="#1f1f1f" stroke-width="4"/><path d="M0 -22 L0 22" stroke="#4a2a15" stroke-width="3"/></g>`;
      }
      function crossSection(t, buildK, digK) {
        // modern street above, the old city buried below
        let o = BG_SKY;
        const gy = GY;
        o += `<rect x="0" y="${gy}" width="1080" height="${1920 - gy}" fill="#8a6a4a"/><path d="M0 ${gy} L1080 ${gy}" stroke="#1f1f1f" stroke-width="7"/>`;
        for (let i = 0; i < 18; i++) o += `<circle cx="${(i * 131) % 1080}" cy="${gy + 40 + ((i * 71) % 220)}" r="${5 + (i % 4)}" fill="#6f5238"/>`;
        o += pyramid(540, gy + 300, 1.15, "#a8925e");
        o += `<g opacity=".9">${houses(260, gy + 300, 3, 1, 3)}${houses(820, gy + 300, 3, 1, 4)}</g>`;
        // colonial city on top, popping in one by one
        const bld = [[150, 160, 150], [330, 120, 220], [540, 200, 260, "iglesia"], [760, 130, 190], [930, 150, 140]];
        bld.forEach(([x, w, h, kind], i) => {
          const k = prog(buildK, i / 6, i / 6 + 0.3, "back");
          if (k <= 0.01) return;
          const hh = h * k;
          o += `<rect x="${x - w / 2}" y="${gy - hh}" width="${w}" height="${hh}" fill="${kind ? "#e8d7b0" : "#f0e6d2"}" stroke="#1f1f1f" stroke-width="5"/>`;
          if (kind && k > 0.9) o += `<rect x="${x - w / 2 - 10}" y="${gy - hh - 90}" width="44" height="90" fill="#e8d7b0" stroke="#1f1f1f" stroke-width="5"/><rect x="${x + w / 2 - 34}" y="${gy - hh - 90}" width="44" height="90" fill="#e8d7b0" stroke="#1f1f1f" stroke-width="5"/><path d="M${x} ${gy - hh - 30} L${x} ${gy - hh - 80} M${x - 16} ${gy - hh - 62} L${x + 16} ${gy - hh - 62}" stroke="#1f1f1f" stroke-width="6"/>`;
          for (let j = 0; j < 2; j++) if (k > 0.9) o += `<rect x="${x - w / 4 + j * (w / 4)}" y="${gy - hh + 30}" width="${w / 6}" height="34" fill="#9fd3f0" stroke="#1f1f1f" stroke-width="3"/>`;
        });
        // the dig: a hole that goes down until it hits the carved stone
        if (digK > 0) {
          const dh = 300 * prog(digK, 0, 0.7);
          o += `<rect x="380" y="${gy}" width="320" height="${dh}" fill="#3b2a1a" stroke="#1f1f1f" stroke-width="5"/>`;
          const st = prog(digK, 0.65, 0.85, "back");
          if (st > 0) {
            o += `<g transform="translate(540 ${gy + 250}) scale(${st})"><circle r="120" fill="#b7b2a8" stroke="#1f1f1f" stroke-width="7"/><circle r="80" fill="none" stroke="#7d786e" stroke-width="6"/><path d="M-60 -20 Q0 -80 60 -20 Q0 40 -60 -20Z M-30 40 Q0 70 30 40" fill="none" stroke="#7d786e" stroke-width="6"/></g>`;
          }
        }
        return o;
      }

      // ---------- characters ----------
      const mexica = (o) => {
        const p = { s: 1.3, f: 1, seed: 21, bare: true, hair: "#1f1f1f", legs: SKIN, hat: "plumes", plumes: ["#2e9e5b", "#d7263d", "#1f6fb2", "#ffd23f", "#d7263d", "#1f6fb2", "#2e9e5b"], hatColor: GOLD, skin: SKIN, shoe: "#a87b4f", cape: BLUE, loin: "#f2e6c9", necklace: GOLD, look: 0.3, mouth: 0.4, ...R.walk(0, 0), ...o };
        if (o.tunic) p.cape = o.tunic.fill; // scenes used tunic colors to tell people apart: now it is the cape
        return p;
      };
      const spaniard = (o) => ({ s: 1.15, f: -1, seed: 31, hat: "morion", beard: "#8a8a8a", shoe: "#3a2a20", legs: "#5a4632", tunic: { fill: STEEL, sash: "#a51d2d" }, look: 0.8, mouth: 0.2, ...R.walk(0, 0), ...o });

      // the six parts of the series, in order (indigenous look, v2)
      const SK = "#c98f68", HAIR = "#1f1f1f", SANDAL = "#a87b4f";
      const CIVS = [
        ["Incas", { hair: HAIR, hat: "mascaipacha", earSpools: true, tunic: { fill: "#c62828", band: ["#e8b330", "#1f1f1f"] }, skin: "#d9a37a", legs: "#d9a37a", shoe: SANDAL }],
        ["Mexicas", { bare: true, hair: HAIR, legs: SK, shoe: SANDAL, skin: SK, hat: "plumes", plumes: ["#2e9e5b", "#d7263d", "#1f6fb2", "#ffd23f", "#d7263d", "#1f6fb2", "#2e9e5b"], hatColor: "#e8b330", cape: "#1f6fb2", loin: "#f2e6c9", shield: "#c62828", necklace: "#e8b330" }],
        ["Mayas", { bare: true, hair: HAIR, legs: SK, shoe: SANDAL, skin: SK, hat: "plumes", plumes: ["#2e9e5b", "#1f6fb2", "#2e9e5b", "#1f6fb2", "#2e9e5b"], hatColor: "#2e9e5b", necklace: "#3fbf7f", loin: "#2e9e5b", facePaint: "#1f6fb2", paint: "#1f6fb2" }],
        ["Taínos", { bare: true, hair: HAIR, legs: SK, shoe: SANDAL, skin: SK, hat: "band", hatColor: "#e07b39", plumes: ["#c62828"], paint: "#c62828", facePaint: "#1f1f1f", chestDisc: true, loin: "#c9a46b" }],
        ["Mapuches", { hair: HAIR, hat: "band", hatColor: "#c0c6cc", tunic: { fill: "#1f3d7a", band: ["#f2f2f2", "#c62828"] }, skin: SK, legs: SK, shoe: SANDAL }],
        ["Guaraníes", { bare: true, hair: HAIR, legs: SK, shoe: SANDAL, skin: SK, hat: "plumes", plumes: ["#ffd23f", "#d7263d", "#ffd23f", "#d7263d", "#ffd23f"], hatColor: "#e07b39", paint: "#1f1f1f", facePaint: "#c62828", bow: true, loin: "#c9a46b" }],
      ];
      const PART = 1; // index of this Short in CIVS
      const cellXY = (i) => [300 + (i % 2) * 480, 760 + Math.floor(i / 2) * 420];
      function check(t, i, pr, seed) {
        const [x, y] = cellXY(i);
        return R.scribble(t, [[x - 70, y - 90], [x - 10, y - 30], [x + 110, y - 190]], pr, "#2e9e5b", 18, seed);
      }
      // labels show only the number; parts already seen show "N. Name";
      // this Short's own name appears at the end (reveal 0..1)
      function sCover(t, zoom, extra = "", reveal = 0) {
        if (typeof extra === "object") extra = extra.extra || "";
        let g = BG_SOFT + `<text x="540" y="250" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="74" fill="#1f1f1f">LAS CIVILIZACIONES</text><text x="540" y="345" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="74" fill="#c62828">DE AMÉRICA</text>`;
        CIVS.forEach(([name, o], i) => {
          const [cx, cy] = cellXY(i), hl = i === PART;
          g += `<rect x="${cx - 215}" y="${cy - 290}" width="430" height="390" rx="30" fill="${hl ? "#fff3cf" : "#ffffff"}" stroke="#1f1f1f" stroke-width="${hl ? 7 : 4}"/>`;
          g += R.chibi(t, { x: cx, y: cy + 22, s: 0.9, seed: 300 + i, look: 0.1, mouth: 0.35, ...R.walk(0, 0), ...o });
          const named = i < PART || (i === PART && reveal > 0.5);
          const pk = i === PART && reveal > 0.5 ? 1 + 0.3 * (1 - prog(reveal, 0.5, 1, "out")) : 1;
          g += `<text x="${cx}" y="${cy + 80}" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="${((named ? 44 : 58) * pk).toFixed(1)}" fill="#1f1f1f">${named ? `${i + 1}. ${name}` : `${i + 1}`}</text>`;
        });
        for (let i = 0; i < PART; i++) g += check(t, i, 1, 810 + i * 3);
        g += extra;
        const [zx, zy] = cellXY(PART), z = 1 + zoom * 1.6;
        return `<g transform="translate(${(zx - zx * z).toFixed(1)} ${(zy - 150 - (zy - 150) * z).toFixed(1)}) scale(${z.toFixed(3)})">${g}</g>` +
          `<text x="540" y="1860" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="40" fill="#1f1f1f" opacity="${(1 - zoom).toFixed(2)}">Siglos en Palitos</text>`;
      }

      // ---------- scenes (timed by fractions of their narration block) ----------
      function sHook(t) {
        const i = 0;
        if (t < at(i, 0.58)) {
          // "¿Conoces a los aztecas?" -> the name gets crossed out
          let o = BG_SOFT;
          const m = mexica({ x: 540, y: 1300, s: 1.5, mouth: 0.5 });
          if (popIn(m, t, at(i, 0.02))) o += R.chibi(t, m);
          o += title(t, "¿AZTECAS?", at(i, 0.04), at(i, 0.58), 560, 130, "#1f1f1f");
          if (t > at(i, 0.24)) o += R.scribble(t, [[200, 540], [880, 530]], prog(t, at(i, 0.24), at(i, 0.36)), C.red, 20, 901);
          if (t > at(i, 0.3)) { m.worry = 0.6; }
          return o;
        }
        if (t < at(i, 0.84)) {
          // "...y que su capital nunca murió en 1521"
          let o = BG_LAKE + city(t);
          o += title(t, "1521", at(i, 0.62), at(i, 0.84), 320, 130);
          return o;
        }
        // "¿Por qué?": people walking over the buried city
        let o = crossSection(t, 1, 0);
        for (let j = 0; j < 4; j++) {
          const x = ((t - at(i, 0.84)) * 90 + j * 280) % 1250 - 100;
          o += R.chibi(t, { x, y: GY, s: 0.75, f: 1, seed: 600 + j, tunic: { fill: ["#e07b39", "#2e9e5b", "#1f6fb2", "#c62828"][j] }, legs: "#2b3a55", look: 0.8, mouth: 0.4, ...R.walk(t * 9 + j, 1) });
        }
        // the question stays on screen even though it is not spoken
        o += title(t, "¿POR QUÉ?", at(i, 0.84), at(i, 1.0) + 0.3, 300, 110, RED);
        return o;
      }

      function sOrigin(t) {
        const i = 1;
        if (t < at(i, 0.18)) {
          // "Se llamaban mexicas, y hoy te cuento su historia"
          let o = BG_SOFT;
          o += title(t, "MEXICAS", at(i, 0.0), at(i, 0.18), 600, 160, BLUE);
          const m = mexica({ x: 540, y: 1300, s: 1.5, mouth: 0.8, armF: { a: 2.6, b: 0.2 } });
          if (popIn(m, t, at(i, 0.01))) o += R.chibi(t, m);
          return o;
        }
        if (t < at(i, 0.45)) {
          // "se dice que 500 españoles borraron su capital del mapa, pero veamos qué pasó"
          let o = BG_LAKE + city(t);
          for (let j = 0; j < 10; j++) { const k = pop(t, at(i, 0.19) + j * 0.05); if (k > 0.01) o += R.mini(t, 120 + j * 50, 1335, 0.85 * k, { seed: 500 + j, helmet: "morion", spear: true, tip: "#c9d1d9", cloth: STEEL }); }
          o += title(t, "¿500?", at(i, 0.19), at(i, 0.45), 300, 140, STEEL);
          const dust = kf(t, [[at(i, 0.27), 0], [at(i, 0.33), 1, "out"], [at(i, 0.38), 1], [at(i, 0.43), 0, "in"]]);
          if (dust > 0.01) for (let j = 0; j < 9; j++) { const a = (j / 9) * Math.PI * 2; o += `<circle cx="${(540 + Math.cos(a) * 200 * dust).toFixed(1)}" cy="${(1080 + Math.sin(a) * 110 * dust).toFixed(1)}" r="${(140 * dust).toFixed(1)}" fill="#ececec" stroke="#1f1f1f" stroke-width="5"/>`; }
          return o;
        }
        // the legend: an eagle on a cactus, on an island in a lake
        let o = BG_LAKE;
        const isl = pop(t, at(i, 0.74));
        if (isl > 0.01) o += `<ellipse cx="540" cy="1130" rx="${220 * isl}" ry="${60 * isl}" fill="#c9b27a" stroke="#1f1f1f" stroke-width="6"/>`;
        o += eagleNopal(540, 1110, 0.95 * pop(t, at(i, 0.5)));
        o += title(t, "1325", at(i, 0.88), at(i, 1.0) + 0.3, 300, 120);
        o += title(t, "TENOCHTITLAN", at(i, 0.92), at(i, 1.0) + 0.3, 430, 84, BLUE);
        return o;
      }

      function sAlliance(t) {
        const i = 2;
        let o = BG_SKY + R.ground(t, GROUND, 0, 1080, 1);
        if (t < at(i, 0.24)) {
          // a small people
          const m = mexica({ x: 360, y: GROUND, s: 1.1, mouth: 0.1, worry: 0.5, armF: { a: 2.4, b: 0.2 } });
          o += R.chibi(t, m);
          o += R.chibi(t, spaniard({ x: 760, y: GROUND, s: 1.1, f: -1, hat: "cap", hatColor: "#7a6a58", beard: null, tunic: { fill: "#c9a46b" }, look: 0.7, mouth: 0.5 }));
          o += title(t, "PUEBLO CHICO", at(i, 0.0), at(i, 0.24), 300, 90, "#555555");
          return o;
        }
        // 1428: three cities shake hands, tribute pours in
        [[290, 61, "#e07b39"], [540, 62, BLUE], [790, 63, GREEN]].forEach(([x, sd, col], j) => {
          const p = mexica({ x, y: GROUND, s: 1.05, seed: sd, tunic: { fill: col }, mouth: 0.8, armF: { a: 2.5, b: 0.2 } });
          if (popIn(p, t, at(i, 0.25) + j * 0.12)) o += R.chibi(t, p);
        });
        o += title(t, "1428", at(i, 0.27), at(i, 1.0), 300, 130);
        const kinds = ["maiz", "pluma", "cacao"];
        for (let j = 0; j < 9; j++) {
          const st = at(i, 0.55) + j * 0.25, pr = prog(t, st, st + 1.0, "inOut");
          if (pr <= 0 || pr >= 1) continue;
          const sx = j % 2 ? -60 : 1140, sy = 520 + (j % 3) * 120;
          o += item(kinds[j % 3], sx + (540 - sx) * pr, sy + (900 - sy) * pr, 1.3);
        }
        o += title(t, "TRIBUTO", at(i, 0.7), at(i, 1.0), 430, 84, GOLD_DARK);
        return o;
      }

      function sCapital(t) {
        const i = 3;
        let o = BG_LAKE + city(t, { grow: prog(t, at(i, 0.05), at(i, 0.66)) });
        o += title(t, "CALZADAS", at(i, 0.1), at(i, 0.3), 300, 84) + title(t, "ACUEDUCTO", at(i, 0.3), at(i, 0.45), 300, 84) + title(t, "CULTIVOS", at(i, 0.45), at(i, 0.68), 300, 84, GREEN);
        if (t > at(i, 0.68)) {
          // a Spaniard can't believe his eyes
          const sp = spaniard({ x: 860, y: 1340, s: 1.0, f: -1, look: 0.4 });
          const rub = kf(t, [[at(i, 0.7), 0], [at(i, 0.78), 1], [at(i, 0.88), 1], [at(i, 0.94), 0]]);
          sp.chinHand = rub; sp.eyes = rub > 0.5 ? "closed" : "wide"; sp.mouthO = rub > 0.5 ? 0 : 1;
          if (popIn(sp, t, at(i, 0.68))) o += R.chibi(t, sp);
          const b = pop(t, at(i, 0.74));
          if (b > 0.01) o += `<g transform="translate(700 1000) scale(${b})"><ellipse rx="190" ry="70" fill="#fff" stroke="#1f1f1f" stroke-width="5"/><text y="16" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="40" fill="#1f1f1f">¿Es un sueño?</text></g><circle cx="800" cy="1095" r="${14 * b}" fill="#fff" stroke="#1f1f1f" stroke-width="4"/>`;
        }
        return o;
      }

      function sCortes(t) {
        const i = 4;
        let o = BG_SKY + R.ground(t, GROUND, 0, 1080, 1);
        if (t < at(i, 0.72)) {
          const c = spaniard({ x: 760, y: GROUND, s: 1.25, f: -1, look: 0.4, mouth: 0.5 });
          if (popIn(c, t, at(i, 0.0))) o += R.chibi(t, c);
          o += title(t, "CORTÉS, 1519", at(i, 0.02), at(i, 0.72), 300, 84);
          for (let j = 0; j < 4; j++) { const k = pop(t, at(i, 0.08) + j * 0.06); if (k > 0.01) o += R.mini(t, 900 + (j % 2) * 40, GROUND - 30 * Math.floor(j / 2), 0.6 * k, { seed: 700 + j, helmet: "morion", spear: true, tip: "#c9d1d9", cloth: STEEL }); }
          // thousands of Tlaxcaltec allies join
          for (let r = 0; r < 3; r++) for (let j = 0; j < 9; j++) {
            const k = pop(t, at(i, 0.32) + (r * 9 + j) * 0.04);
            if (k > 0.01) o += R.mini(t, 40 + j * 64 + (r % 2) * 30, GROUND - r * 40, (0.9 - r * 0.08) * k, { seed: 720 + r * 9 + j, band: "#ffffff", cloth: j % 2 ? "#c62828" : "#f2f2f2", spear: true, tip: GOLD, skin: SKIN, look: 0.6, hair: "#1f1f1f" });
          }
          o += title(t, "+ TLAXCALTECAS", at(i, 0.36), at(i, 0.72), 430, 76, RED);
          return o;
        }
        // smallpox takes even the new emperor
        let o2 = BG_SKY + R.ground(t, GROUND, 0, 1080, 1);
        const sick = prog(t, at(i, 0.74), at(i, 0.95));
        const em = mexica({ x: 540, y: GROUND, s: 1.4, worry: sick, sweat: sick, lean: 0.25 * sick, mouth: 0.4 - sick });
        if (sick > 0.8) em.eyes = "closed";
        o2 += R.chibi(t, em);
        for (let j = 0; j < 26; j++) { const k = prog(t, at(i, 0.72) + (j % 13) * 0.08, at(i, 0.8) + (j % 13) * 0.08); if (k > 0) o2 += `<circle cx="${200 + ((j * 83) % 680)}" cy="${700 + ((j * 47) % 420)}" r="${7 * k}" fill="#6f6f6f" opacity=".55"/>`; }
        o2 += title(t, "VIRUELA", at(i, 0.75), at(i, 1.0), 300, 110, "#555555");
        return o2;
      }

      function sFall(t) {
        const i = 5;
        let o = crossSection(t, prog(t, at(i, 0.28), at(i, 0.75)), 0);
        o += title(t, "1521", at(i, 0.0), at(i, 0.3), 300, 130);
        if (t < at(i, 0.28)) {
          const smoke = kf(t, [[at(i, 0.05), 0], [at(i, 0.15), 1, "out"]]);
          for (let j = 0; j < 7; j++) o += `<circle cx="${180 + j * 120}" cy="${GY - 80 - (j % 2) * 40}" r="${(70 * smoke).toFixed(1)}" fill="#d9d9d9" stroke="#1f1f1f" stroke-width="4" opacity=".9"/>`;
        }
        o += title(t, "CIUDAD DE MÉXICO", at(i, 0.75), at(i, 1.0), 300, 84, RED);
        return o;
      }

      function sDig(t) {
        const i = 6;
        let o = crossSection(t, 1, prog(t, at(i, 0.38), at(i, 0.95)));
        o += title(t, "SIN SABERLO", at(i, 0.05), at(i, 0.36), 300, 96, RED);
        if (t < at(i, 0.36)) for (let j = 0; j < 4; j++) {
          const x = ((t - at(i, 0)) * 90 + j * 280) % 1250 - 100;
          o += R.chibi(t, { x, y: GY, s: 0.75, f: 1, seed: 600 + j, tunic: { fill: ["#e07b39", "#2e9e5b", "#1f6fb2", "#c62828"][j] }, legs: "#2b3a55", look: 0.8, mouth: 0.4, ...R.walk(t * 9 + j, 1) });
        }
        if (t < at(i, 0.36)) o += `<path d="M540 500 L540 ${GY + 120}" stroke="${RED}" stroke-width="14" stroke-dasharray="30 20"/><path d="M500 ${GY + 90} L540 ${GY + 140} L580 ${GY + 90}" fill="none" stroke="${RED}" stroke-width="14" stroke-linecap="round"/>`;
        o += title(t, "1978", at(i, 0.38), at(i, 1.0), 300, 120);
        // two workers with helmets and shovels
        const found = t > at(i, 0.8);
        [[420, 81, 1], [660, 82, -1]].forEach(([x, sd, f]) => {
          const dig = Math.sin(t * 9 + sd) * 0.5 + 0.5;
          const w = { x, y: GY, s: 0.95, f, seed: sd, hat: "cap", hatColor: "#ffd23f", tunic: { fill: "#e07b39" }, legs: "#2b3a55", look: found ? 0.1 : 0.6, mouth: 0.3, ...R.walk(0, 0) };
          if (!found && t > at(i, 0.38)) { w.armF = { a: 1.0 + dig * 0.6, b: 0.6 }; w.lean = 0.3 * dig; }
          if (found) { w.eyes = "wide"; w.mouthO = 1; }
          if (popIn(w, t, at(i, 0.36))) o += R.chibi(t, w);
        });
        if (found) o += title(t, "¡CLANK!", at(i, 0.8), at(i, 0.9), 640, 110, RED) + title(t, "TEMPLO MAYOR", at(i, 0.88), at(i, 1.0), 430, 84, GOLD_DARK);
        return o;
      }

      function sNext(t) {
        const i = 7;
        const extra = check(t, PART, prog(t, at(i, 0.1), at(i, 0.35)), 821);
        let o = `<rect width="1080" height="1920" fill="#e7f0e1"/><g transform="translate(151 20) scale(0.72)">${sCover(t, 0, extra, prog(t, at(i, 0.1), at(i, 0.35)))}</g>`;
        const th = kf(t, [[at(i, 0.25), 0], [at(i, 0.45), 1, "back"]]) * (1 + 0.06 * Math.max(0, Math.sin((t - at(i, 0.45)) * 6)));
        if (th > 0.01) o += `<g transform="translate(540 1650) scale(${(th * 0.9).toFixed(3)}) rotate(-8)">` +
          `<rect x="-118" y="-8" width="44" height="130" rx="12" fill="#1f6fb2" stroke="#1f1f1f" stroke-width="7"/>` +
          `<path d="M-70 -6 L-40 -6 L-10 -92 Q2 -122 30 -108 Q46 -96 38 -64 L30 -10 L84 -10 Q112 -10 108 18 L96 104 Q92 124 70 124 L-70 124Z" fill="#ffd23f" stroke="#1f1f1f" stroke-width="7" stroke-linejoin="round"/>` +
          `<path d="M42 30 L100 30 M38 64 L98 64 M40 96 L92 96" stroke="#1f1f1f" stroke-width="5" stroke-linecap="round"/></g>`;
        o += title(t, "¡DALE LIKE!", at(i, 0.2), DUR + 1, 1560, 96, C.red);
        return o;
      }

      const SCENES = [sHook, sOrigin, sAlliance, sCapital, sCortes, sFall, sDig, sNext];
      function renderAt(t) {
        let o;
        if (t < BLOCKS[0][0]) o = sCover(t, prog(t, BLOCKS[0][0] - 0.45, BLOCKS[0][0], "in")) + title(t, "2", BLOCKS[0][0] - 0.5, BLOCKS[0][0] + 0.05, 1600, 200, RED);
        else {
          let i = BLOCKS.findIndex(([a, b]) => t < b);
          if (i < 0) i = BLOCKS.length - 1;
          o = SCENES[i](t);
        }
        layer.innerHTML = o + captions(t);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      renderAt(0);
    </script>
  </body>
</html>
